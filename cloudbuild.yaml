# Deploy KlausulKu to Cloud Run via Cloud Build (no local Docker required).
#
# Usage (Cloud Shell or machine with gcloud):
#   gcloud config set project klausulku
#   gcloud services enable run.googleapis.com cloudbuild.googleapis.com artifactregistry.googleapis.com
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_VITE_GEMINI_API_KEY="YOUR_KEY",_VITE_GCP_PROJECT_ID=483216655534

substitutions:
  _VITE_GEMINI_API_KEY: ''
  _VITE_GEMINI_API_KEY_BACKUP: ''
  _VITE_GCP_PROJECT_ID: '483216655534'
  _REGION: 'asia-southeast2'
  _SERVICE: 'klausulku'

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - VITE_GEMINI_API_KEY=${_VITE_GEMINI_API_KEY}
      - --build-arg
      - VITE_GEMINI_API_KEY_BACKUP=${_VITE_GEMINI_API_KEY_BACKUP}
      - --build-arg
      - VITE_GCP_PROJECT_ID=${_VITE_GCP_PROJECT_ID}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --port
      - '8080'

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/${_SERVICE}:$BUILD_ID

options:
  logging: CLOUD_LOGGING_ONLY
